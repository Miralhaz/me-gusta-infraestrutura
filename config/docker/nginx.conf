# =============================================================================
# MeGusta Frontend - Nginx (SPA + reverse proxy para o backend)
# =============================================================================
# - Serve o build do Vite/React com fallback SPA (try_files /index.html)
# - Encaminha /api/* para o servico "backend:8080" na rede overlay do Swarm.
#   Isso torna as chamadas same-origin:
#     * o navegador nao usa "localhost"
#     * nao existe CORS (a origem nao muda)
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (ex.: planilha de vendas .xlsx)
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ---------------------------------------------------------------------
    # API -> backend Spring Boot
    # /api/login  -> http://backend:8080/login
    # /api/insumos/geral -> http://backend:8080/insumos/geral
    # ---------------------------------------------------------------------
    location /api/ {
        # resolver interno do Docker (Swarm) para nao falhar no boot do nginx
        # caso o backend ainda nao esteja registrado no DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_api http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O backend so aceita a origem http://localhost:5173 no CORS.
        # Como o proxy torna a chamada "same-origin", removemos o header
        # Origin para que o Spring Security nao aplique CORS.
        proxy_set_header Origin "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Documentacao da API acessivel via ALB (opcional, util para debug)
    location /v3/api-docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_docs http://backend:8080;
        proxy_pass $backend_docs;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
    }

    location /swagger-ui {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_swagger http://backend:8080;
        proxy_pass $backend_swagger;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
    }

    location = /swagger-ui.html {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_swagger_html http://backend:8080;
        proxy_pass $backend_swagger_html;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
    }

    # Assets estaticos (hash no nome, cache longo)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check usado pelo target group do ALB
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # index.html sempre revalidado
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback SPA: qualquer rota do React Router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
