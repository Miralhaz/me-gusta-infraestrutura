# =============================================================================
# MeGusta RabbitMQ Configuration
# =============================================================================
# Broker unico (1 replica). A topologia (exchange, fila, binding, DLQ) e
# declarada pelos servicos no startup, nao por definitions.
# =============================================================================

# Default vhost
default_vhost = /

# Usuario inicial (semeado pelo broker no primeiro boot com volume vazio)
default_user = admin
default_pass = admin

# Clustering DESABILITADO: o stack roda UM broker unico (`rabbitmq`). As linhas
# de peer discovery abaixo apontavam para rabbit@rabbitmq-1/2, nos que nao
# existem; o broker logava "could not discover and join another node; proceeding
# as a standalone node" e perdia alguns segundos no boot. Se um dia houver
# cluster real, descomente e ajuste os hostnames.
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
# cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
# cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Sem definicao de tipo de fila aqui: o consumer declara a fila que consome
# (durable). `queue_master_locator` foi removido junto com as mirrored queues
# do 3.x e nao tem efeito util num broker unico.
# NOTA: `quorum_queue.memory.high_watermark.absolute` NAO existe no RabbitMQ e
# aborta o boot ("Conf file attempted to set unknown variable"). O limite de
# memoria e definido por `vm_memory_high_watermark.*` (relativo/absoluto) abaixo.

# Management plugin
# NAO use `management.load_definitions` aqui. No RabbitMQ 4.4.x (imagem tag
# 4-management-alpine) o import no boot trava para sempre em
# "Importing concurrently 1 users..." quando os definitions sao carregados por
# este parametro — reproduzido com a imagem oficial, definitions minimo e sem
# alarme de recurso. O topologia nao precisa disso: o backend declara o exchange
# "megusta.estoque" e o consumer declara a fila "megusta.email.alertas", o
# binding e a DLQ. O usuario admin/vhost "/" sao semeados por default_user,
# default_pass e default_vhost (acima) no primeiro boot com volume vazio.
# management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info
log.file.level = info

# Network
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory and disk alarms
# Limites ABSOLUTOS de proposito: o broker enxerga a memoria/disco do HOST
# (ex.: 3,8 GB RAM / 2,7 GB livres), nao o limite de 512M do container. Com
# `disk_free_limit.relative = 2.0` o limite virava 8 GB e o disco de 2,7 GB
# disparava o alarme ("Free disk space is insufficient... Publishers will be
# blocked"), bloqueando publicacoes mesmo com o broker de pe. 256MB e suficiente
# para um broker de laboratorio e bem abaixo do disco livre tipico do Academy.
vm_memory_high_watermark.absolute = 256MB
disk_free_limit.absolute = 256MB
