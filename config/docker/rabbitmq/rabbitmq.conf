# =============================================================================
# MeGusta RabbitMQ Configuration
# =============================================================================
# HA Policy: Quorum queues with automatic synchronization
# =============================================================================

# Default vhost
default_vhost = /

# Default user (created by management plugin)
default_user = admin
default_pass = admin

# Erlang cookie for clustering
# IMPORTANT: Same cookie on all nodes for clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Queue defaults - use quorum queues (HA) for all queues
queue_master_locator = min-masters
# NOTA: `quorum_queue.memory.high_watermark.absolute` NAO existe no RabbitMQ e
# aborta o boot ("Conf file attempted to set unknown variable"). O limite de
# memoria e definido por `vm_memory_high_watermark.*` (relativo/absoluto) abaixo.

# Management plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info
log.file.level = info

# Network
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory and disk alarms
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 2.0